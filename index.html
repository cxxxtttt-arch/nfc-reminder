<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Reminder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f5f5f5;
        }

        .box {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 28px;
        }

        .message {
            font-size: 20px;
            margin: 25px 0;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔔 NFC Reminder</h1>

    <p class="message">
        Don't forget to take your things!
    </p>

    <p class="status">
        ● Reminder is active
    </p>

</div>

</body>
</html>
